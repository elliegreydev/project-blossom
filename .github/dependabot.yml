# Weekly dependency checks. Flags a vulnerable or outdated package as a PR so a
# framework CVE like the Next one patched in August gets surfaced automatically
# rather than waiting for someone to notice.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # One PR for routine patch/minor bumps; security fixes still come alone.
      minor-and-patch:
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
